name: Restore Light Light frontend
on:
  push:
    branches: [main]
    paths: ['source.bundle.b64']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack reviewed application sources
        run: |
          python3 - <<'PY'
          import base64, io, tarfile
          from pathlib import Path
          raw = base64.b64decode(Path('source.bundle.b64').read_text())
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as tar:
              for member in tar.getmembers():
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                      raise ValueError('invalid archive path')
              tar.extractall('.', filter='data')
          PY
          rm source.bundle.b64 .github/workflows/restore-remaster.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: rebuild Light Light frontend and simplify UI'
          git push origin HEAD:main
